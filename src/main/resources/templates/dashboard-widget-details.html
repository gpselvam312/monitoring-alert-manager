<!DOCTYPE html>

<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout('Widget Details', ~{::content})}">

<body><div th:fragment="content">
    <div class="page-header"><div><h1 class="page-title" th:text="${widget.name}">Widget Details</h1>
        <p class="page-subtitle">Historical monitoring executions for this dashboard widget.</p></div>
        <div class="page-header-actions"><a th:href="@{/dashboard}" class="btn btn-outline-primary"><i class="bi bi-arrow-left me-1"></i>Back to Dashboard</a></div>
    </div>
    <div class="app-card"><div class="app-card-body p-0" id="dashboardWidgetDetailsTableWrapper">
        <div th:replace="~{fragments/data-table :: controls('dashboardWidgetDetailsSearch', 'dashboardWidgetDetailsPageSize', 'Search executions...', ${pageSize}, ${search})}"></div>
        <div id="dashboardWidgetDetailsTableContainer"><div th:fragment="dashboardWidgetDetailsTable">
            <div th:if="${history.totalElements == 0}" class="empty-state"><div class="empty-state-icon"><i class="bi bi-clock-history"></i></div>
                <h6 th:text="${search != null and !search.isBlank() ? 'No executions match your search' : 'No execution history available'}">No execution history available</h6>
                <p th:text="${search != null and !search.isBlank() ? 'Try a different search term or clear the search.' : 'This widget has no monitoring execution history yet.'}">No execution history available.</p>
            </div>
            <div th:if="${history.totalElements > 0}" class="table-responsive"><table class="table app-table align-middle mb-0"><thead><tr>
                <th>Started</th><th>Completed</th><th>Status</th><th>Attempt</th><th>Duration</th><th>Error</th><th class="text-end table-actions-column">Actions</th>
            </tr></thead><tbody>
            <tr th:each="execution : ${history.content}">
                <td th:text="${#temporals.format(execution.startedAt, 'yyyy-MM-dd HH:mm:ss')}">—</td>
                <td th:text="${execution.completedAt != null ? #temporals.format(execution.completedAt, 'yyyy-MM-dd HH:mm:ss') : 'Running'}">—</td>
                <td><span th:switch="${execution.status}">
                    <span th:case="${T(com.dxc.monitoring.entity.MonitoringExecution.ExecutionStatus).SUCCESS}" class="status-badge status-healthy"><span class="status-dot"></span>SUCCESS</span>
                    <span th:case="${T(com.dxc.monitoring.entity.MonitoringExecution.ExecutionStatus).RUNNING}" class="status-badge status-warning"><span class="status-dot"></span>RUNNING</span>
                    <span th:case="${T(com.dxc.monitoring.entity.MonitoringExecution.ExecutionStatus).FAILED}" class="status-badge status-critical"><span class="status-dot"></span>FAILED</span>
                    <span th:case="${T(com.dxc.monitoring.entity.MonitoringExecution.ExecutionStatus).TIMEOUT}" class="status-badge status-critical"><span class="status-dot"></span>TIMEOUT</span>
                    <span th:case="${T(com.dxc.monitoring.entity.MonitoringExecution.ExecutionStatus).ERROR}" class="status-badge status-critical"><span class="status-dot"></span>ERROR</span>
                </span></td>
                <td th:text="${execution.attemptNumber}">1</td><td th:text="${execution.durationMs != null ? execution.durationMs + ' ms' : '—'}">—</td>
                <td class="table-secondary-text" th:text="${execution.errorMessage != null ? execution.errorMessage : '—'}">—</td>
                <td class="text-end table-actions-column"><a class="btn btn-sm btn-outline-primary"
                    th:href="@{/monitoring/jobs/{jobId}/executions/{executionId}(jobId=${execution.monitoringJob.id}, executionId=${execution.id})}" title="View execution details" aria-label="View execution details">
                    <i class="bi bi-chevron-right"></i></a></td>
            </tr></tbody></table></div>
            <div th:replace="~{fragments/data-table :: pagination(${history}, ${pageSize}, 'dashboardWidgetDetailsTableConfig')}"></div>
        </div></div></div></div>
    <script th:inline="javascript">window.dashboardWidgetDetailsTableConfig = {
        endpoint: '/dashboard/widgets/' + /*[[${widget.id}]]*/ 0 + '/details', searchId: 'dashboardWidgetDetailsSearch',
        clearSearchId: 'clear-dashboardWidgetDetailsSearch', pageSizeId: 'dashboardWidgetDetailsPageSize', containerId: 'dashboardWidgetDetailsTableContainer',
        sort: /*[[${sort}]]*/ 'startedAt', direction: /*[[${direction}]]*/ 'desc'
    };</script>
</div></body></html>
