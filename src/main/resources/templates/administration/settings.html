<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<div th:replace="~{fragments/layout :: layout('Global Settings', ~{::content})}">
    <div th:fragment="content">
        <div class="d-flex flex-column flex-md-row align-items-md-center justify-content-between gap-2 mb-4">
            <div>
                <h2 class="mb-1">Global Settings</h2>
                <p class="text-muted mb-0">Manage application-wide configuration values.</p>
            </div>
        </div>

        <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
            <span th:text="${successMessage}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
        <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
            <span th:text="${errorMessage}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>

        <form method="post" th:action="@{/administration/settings}">
            <div class="card">
                <div class="card-header d-flex align-items-center justify-content-between">
                    <h5 class="mb-0"><i class="bi bi-sliders me-2"></i>Configuration</h5>
                    <span class="text-muted small" th:text="| ${settings.size()} settings |"></span>
                </div>
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead>
                            <tr>
                                <th scope="col" style="min-width: 190px;">Setting</th>
                                <th scope="col" style="min-width: 240px;">Description</th>
                                <th scope="col" style="min-width: 280px;">Value</th>
                                <th scope="col" style="width: 110px;">Type</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="setting : ${settings}">
                                <td>
                                    <label class="form-label fw-semibold mb-1"
                                           th:for="|value_${setting.settingKey}|"
                                           th:text="${setting.settingKey}"></label>
                                    <div class="text-muted small" th:text="|Order: ${setting.sortOrder}|"></div>
                                </td>
                                <td>
                                    <span class="small text-muted"
                                          th:text="${setting.description != null ? setting.description : 'No description provided.'}"></span>
                                </td>
                                <td>
                                    <div th:switch="${setting.dataType}">
                                        <select th:case="'BOOLEAN'" class="form-select"
                                                th:id="|value_${setting.settingKey}|"
                                                th:name="|value_${setting.settingKey}|" required>
                                            <option value="true" th:selected="${setting.settingValue.equalsIgnoreCase('true')}">Enabled / True</option>
                                            <option value="false" th:selected="${setting.settingValue.equalsIgnoreCase('false')}">Disabled / False</option>
                                        </select>
                                        <select th:case="'STRING'" th:if="${setting.settingKey == 'THEME'}"
                                                class="form-select" th:id="|value_${setting.settingKey}|"
                                                th:name="|value_${setting.settingKey}|" required>
                                            <option value="orange" th:selected="${setting.settingValue == 'orange'}">Orange</option>
                                            <option value="orange-dark" th:selected="${setting.settingValue == 'orange-dark'}">Orange Dark</option>
                                            <option value="blue" th:selected="${setting.settingValue == 'blue'}">Blue</option>
                                            <option value="blue-dark" th:selected="${setting.settingValue == 'blue-dark'}">Blue Dark</option>
                                            <option value="green" th:selected="${setting.settingValue == 'green'}">Green</option>
                                            <option value="purple" th:selected="${setting.settingValue == 'purple'}">Purple</option>
                                        </select>
                                        <textarea th:case="'JSON'" class="form-control font-monospace" rows="3"
                                                  th:id="|value_${setting.settingKey}|"
                                                  th:name="|value_${setting.settingKey}|"
                                                  th:text="${setting.settingValue}" required></textarea>
                                        <input th:case="'INTEGER'" type="number" class="form-control"
                                               th:id="|value_${setting.settingKey}|"
                                               th:name="|value_${setting.settingKey}|"
                                               th:value="${setting.settingValue}" required>
                                        <textarea th:case="'STRING'" th:if="${setting.settingKey == 'MAINTENANCE_MESSAGE'}"
                                                  class="form-control" rows="3" maxlength="500"
                                                  th:id="|value_${setting.settingKey}|"
                                                  th:name="|value_${setting.settingKey}|"
                                                  th:text="${setting.settingValue}" required></textarea>
                                        <input th:case="'STRING'" th:unless="${setting.settingKey == 'THEME' or setting.settingKey == 'MAINTENANCE_MESSAGE'}"
                                               type="text" class="form-control" maxlength="500"
                                               th:id="|value_${setting.settingKey}|"
                                               th:name="|value_${setting.settingKey}|"
                                               th:value="${setting.settingValue}" required>
                                    </div>
                                </td>
                                <td><span class="badge text-bg-secondary" th:text="${setting.dataType}"></span></td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(settings)}">
                                <td colspan="4" class="text-center text-muted py-4">No settings are registered.</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
                <div class="card-footer d-flex flex-column flex-sm-row align-items-sm-center justify-content-between gap-2">
                    <span class="text-muted small">Setting keys and metadata are managed through database migrations.</span>
                    <button type="submit" class="btn btn-primary">
                        <i class="bi bi-check-lg me-1"></i>Save Settings
                    </button>
                </div>
            </div>
        </form>
    </div>
</div>
</html>
