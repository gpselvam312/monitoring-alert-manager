<!DOCTYPE html>

<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head th:replace="~{fragments/head :: head(${pageTitle})}"></head>

<body>

<div class="app-shell">

<div th:replace="~{fragments/sidebar :: sidebar}"></div>

<div class="app-main">

    <div th:replace="~{fragments/header :: header(${pageTitle})}"></div>

    <main class="app-content">

        <div class="page-header">

            <div>

                <h1 class="page-title"
                    th:text="${pageTitle}">
                    Add Environment
                </h1>

                <p class="page-subtitle">
                    Configure a shared environment available to all applications.
                </p>

            </div>

        </div>

        <form sec:authorize="hasAuthority('SYSTEM_CONFIG')"
              th:action="@{/administration/environments/save}"
              th:object="${environment}"
              method="post">

            <input type="hidden"
                   th:field="*{id}">

            <div class="app-card mb-4">

                <div class="app-card-header">

                    <div>

                        <h2 class="app-card-title">
                            Environment Details
                        </h2>

                        <p class="app-card-subtitle">
                            Define the environment identity and status.
                        </p>

                    </div>

                </div>

                <div class="app-card-body">

                    <div class="row g-4">

                        <div class="col-12 col-md-6">

                            <label for="name"
                                   class="form-label">

                                Environment Name
                                <span class="text-danger">*</span>

                            </label>

                            <input type="text"
                                   id="name"
                                   th:field="*{name}"
                                   class="form-control"
                                   maxlength="50"
                                   required
                                   placeholder="e.g. PROD">

                            <div class="form-text">
                                Use a unique environment name.
                            </div>

                        </div>

                        <div class="col-12">

                            <label for="description"
                                   class="form-label">

                                Description

                            </label>

                            <textarea id="description"
                                      th:field="*{description}"
                                      class="form-control"
                                      rows="4"
                                      maxlength="500"
                                      placeholder="Describe the environment."></textarea>

                        </div>

                        <div class="col-12">

                            <div class="machine-enabled-option">

                                <div class="machine-enabled-icon">
                                    <i class="bi bi-check-circle"></i>
                                </div>

                                <div class="machine-enabled-content">

                                    <label for="enabled"
                                           class="machine-enabled-title">

                                        Environment enabled

                                    </label>

                                    <div class="machine-enabled-description">

                                        Enabled environments can be selected for any application's monitoring jobs and dashboard tabs.

                                    </div>

                                </div>

                                <div class="machine-enabled-switch form-check form-switch">

                                    <input id="enabled"
                                           class="form-check-input"
                                           type="checkbox"
                                           th:field="*{enabled}">

                                </div>

                            </div>

                        </div>

                    </div>

                </div>

            </div>

            <div class="form-actions">

                <a th:href="@{/administration/environments}"
                   class="btn btn-outline-secondary">

                    Cancel

                </a>

                <button type="submit"
                        class="btn btn-primary">

                    <i class="bi bi-check-lg"></i>
                    Save Environment

                </button>

            </div>

        </form>

    </main>

</div>

</div>

<div th:replace="~{fragments/footer :: footer}"></div>

<div th:replace="~{fragments/scripts :: scripts}"></div>

</body>

</html>
