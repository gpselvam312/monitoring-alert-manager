<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: layout('Alert History', ~{::content})}">
<body><div th:fragment="content">
<div class="page-header"><div><h1 class="page-title"><i class="bi bi-clock-history me-2"></i>Alert History</h1><p class="page-subtitle">A complete view of alert lifecycles, including active and recovered alerts.</p></div></div>
<div class="row g-3 mb-3 alert-history-status-cards">
<div class="col-12 col-md-4"><a class="text-decoration-none" th:href="@{/alerts/history(search=${search},severity=${severity},applicationId=${applicationId},environmentId=${environmentId},size=${pageSize})}"><section class="dashboard-widget h-100"><div class="dashboard-widget-header"><div class="dashboard-widget-title-group"><div class="dashboard-widget-icon"><i class="bi bi-collection"></i></div><div class="dashboard-widget-title-line min-w-0"><h5 class="dashboard-widget-title">All Alerts</h5><span class="dashboard-widget-description">Complete alert history</span></div></div><div class="dashboard-widget-actions"><span class="dashboard-status dashboard-status-gray"><i class="bi bi-list-ul"></i><span>All</span></span></div></div><div class="dashboard-widget-body"><div class="dashboard-widget-value" th:text="${totalAlerts}">0</div></div></div></section></a></div>
<div class="col-12 col-md-4"><a class="text-decoration-none" th:href="@{/alerts/history(status='ACTIVE',search=${search},severity=${severity},applicationId=${applicationId},environmentId=${environmentId})}"><section class="dashboard-widget h-100"><div class="dashboard-widget-header"><div class="dashboard-widget-title-group"><div class="dashboard-widget-icon"><i class="bi bi-bell"></i></div><div class="dashboard-widget-title-line min-w-0"><h5 class="dashboard-widget-title">Active Alerts</h5><span class="dashboard-widget-description">Alerts requiring attention</span></div></div><div class="dashboard-widget-actions"><span class="dashboard-status dashboard-status-red"><i class="bi bi-exclamation-circle-fill"></i><span>Active</span></span></div></div><div class="dashboard-widget-body"><div class="dashboard-widget-value" th:text="${activeAlerts}">0</div></div></div></section></a></div>
<div class="col-12 col-md-4"><a class="text-decoration-none" th:href="@{/alerts/history(status='RESOLVED',search=${search},severity=${severity},applicationId=${applicationId},environmentId=${environmentId})}"><section class="dashboard-widget h-100"><div class="dashboard-widget-header"><div class="dashboard-widget-title-group"><div class="dashboard-widget-icon"><i class="bi bi-check2-circle"></i></div><div class="dashboard-widget-title-line min-w-0"><h5 class="dashboard-widget-title">Recovered</h5><span class="dashboard-widget-description">Alerts that have recovered</span></div></div><div class="dashboard-widget-actions"><span class="dashboard-status dashboard-status-green"><i class="bi bi-check-circle-fill"></i><span>Recovered</span></span></div></div><div class="dashboard-widget-body"><div class="dashboard-widget-value" th:text="${resolvedAlerts}">0</div></div></div></section></a></div>
</div>
<div class="app-card">
<div class="row g-2 p-3 align-items-end">
<div class="col-6 col-lg-3"><label class="form-label small" for="alertHistoryStatus">Status</label><select class="form-select form-select-sm" id="alertHistoryStatus"><option value="">All statuses</option><option value="ACTIVE" th:selected="${status == 'ACTIVE'}">Active</option><option value="RESOLVED" th:selected="${status == 'RESOLVED'}">Recovered</option></select></div>
<div class="col-6 col-lg-3"><label class="form-label small" for="alertHistorySeverity">Severity</label><select class="form-select form-select-sm" id="alertHistorySeverity"><option value="">All severities</option><option th:each="item : ${T(com.dxc.monitoring.entity.AlertRule.Severity).values()}" th:value="${item.name()}" th:text="${item.name()}" th:selected="${severity == item.name()}"></option></select></div>
<div class="col-6 col-lg-3"><label class="form-label small" for="alertHistoryApplication">Application</label><select class="form-select form-select-sm" id="alertHistoryApplication"><option value="">All applications</option><option th:each="app : ${applications}" th:value="${app.id}" th:text="${app.name}" th:selected="${applicationId == app.id}"></option></select></div>
<div class="col-6 col-lg-3"><label class="form-label small" for="alertHistoryEnvironment">Environment</label><select class="form-select form-select-sm" id="alertHistoryEnvironment"><option value="">All environments</option><option th:each="env : ${environments}" th:value="${env.id}" th:text="${env.name}" th:selected="${environmentId == env.id}"></option></select></div>
<div class="col-12 d-flex justify-content-end"><button type="button" class="btn btn-sm btn-outline-secondary" id="alertHistoryClearFilters"><i class="bi bi-arrow-counterclockwise me-1"></i>Clear filters</button></div>
</div>
<div class="border-bottom" th:replace="~{fragments/data-table :: controls('alertHistorySearch','alertHistoryPageSize','Alert ID, title, job or application',${pageSize},${search})}"></div>
<div id="alertHistoryTableContainer" class="table-responsive"><div class="p-4 text-muted text-center">Loading alert history...</div></div>
<div th:replace="~{fragments/data-table :: clientPagination('alertHistoryPagination','alertHistoryPaginationSummary','alertHistoryFirst','alertHistoryPrevious','alertHistoryNext','alertHistoryLast')}"></div>
</div>
<script th:inline="javascript">
window.alertHistoryConfig = { endpoint: /*[[@{/alerts/history/batch}]]*/ '/alerts/history/batch', detailEndpoint: /*[[@{/alerts/}]]*/ '/alerts/', searchId: 'alertHistorySearch', pageSizeId: 'alertHistoryPageSize', containerId: 'alertHistoryTableContainer', filters: { status: 'alertHistoryStatus', severity: 'alertHistorySeverity', applicationId: 'alertHistoryApplication', environmentId: 'alertHistoryEnvironment' }, sort: /*[[${sort}]]*/ 'createdAt', direction: /*[[${direction}]]*/ 'desc' };
</script><script th:src="@{/js/alert-history.js}"></script>
</div></body></html>
