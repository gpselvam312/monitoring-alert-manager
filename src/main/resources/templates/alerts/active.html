<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{fragments/layout :: layout('Active Alerts', ~{::content})}">
<body><div th:fragment="content">
<div class="page-header"><div><h1 class="page-title"><i class="bi bi-exclamation-triangle me-2"></i>Active Alerts</h1><p class="page-subtitle">Current alert conditions across applications you can access.</p></div>
<div class="page-header-actions" sec:authorize="hasAuthority('ALERT_CONFIG')"><a th:href="@{/alerts/rules}" class="btn btn-outline-primary"><i class="bi bi-sliders me-1"></i>Alert Rules</a></div></div>
<div class="app-card">
<div class="row g-2 p-2 align-items-end">
<div class="col-6 col-lg-2"><label class="form-label small mb-1" for="activeAlertSeverity">Severity</label><select class="form-select form-select-sm" id="activeAlertSeverity"><option value="">All severities</option><option th:each="item : ${T(com.dxc.monitoring.entity.AlertRule.Severity).values()}" th:value="${item.name()}" th:text="${item.name()}" th:selected="${severity == item.name()}"></option></select></div>
<div class="col-6 col-lg-3"><label class="form-label small mb-1" for="activeAlertApplication">Application</label><select class="form-select form-select-sm" id="activeAlertApplication"><option value="">All applications</option><option th:each="app : ${applications}" th:value="${app.id}" th:text="${app.name}" th:selected="${applicationId == app.id}"></option></select></div>
<div class="col-6 col-lg-3"><label class="form-label small mb-1" for="activeAlertEnvironment">Environment</label><select class="form-select form-select-sm" id="activeAlertEnvironment"><option value="">All environments</option><option th:each="env : ${environments}" th:value="${env.id}" th:attr="data-application-id=${env.application.id}" th:text="${env.name}" th:selected="${environmentId == env.id}"></option></select></div>
<div class="col-6 col-lg-4 d-flex justify-content-end"><button type="button" class="btn btn-sm btn-outline-secondary" id="activeAlertClearFilters"><i class="bi bi-arrow-counterclockwise me-1"></i>Clear filters</button></div>
</div>
<div class="border-bottom" th:replace="~{fragments/data-table :: controls('activeAlertSearch','activeAlertPageSize','Alert ID, rule, job or application',${pageSize},${search})}"></div>
<div id="activeAlertTableContainer" class="table-responsive"><div class="p-4 text-muted text-center">Loading active alerts...</div></div>
<div th:replace="~{fragments/data-table :: clientPagination('activeAlertPagination','activeAlertPaginationSummary','activeAlertFirst','activeAlertPrevious','activeAlertNext','activeAlertLast')}"></div>
</div>
<script th:inline="javascript">
window.activeAlertConfig = { endpoint: /*[[@{/alerts/history/batch}]]*/ '/alerts/history/batch', detailEndpoint: /*[[@{/alerts/}]]*/ '/alerts/', searchId: 'activeAlertSearch', pageSizeId: 'activeAlertPageSize', containerId: 'activeAlertTableContainer', paginationPrefix: 'activeAlert', clearFiltersId: 'activeAlertClearFilters', filters: { severity: 'activeAlertSeverity', applicationId: 'activeAlertApplication', environmentId: 'activeAlertEnvironment' }, fixedParams: { status: 'ACTIVE' }, sort: /*[[${sort}]]*/ 'lastOccurredAt', direction: /*[[${direction}]]*/ 'desc' };
</script><script th:src="@{/js/active-alerts.js}"></script>
</div></body></html>
