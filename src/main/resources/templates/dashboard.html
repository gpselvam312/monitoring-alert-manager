<!DOCTYPE html>

<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout('Dashboard', ~{::content})}">

<body>

<div th:fragment="content">

    <!-- Loading -->
    <div id="dashboardLoading"
         class="dashboard-state">

        <div class="dashboard-state-icon">
            <i class="bi bi-arrow-repeat dashboard-spin"></i>
        </div>

        <h6>Loading dashboard</h6>

        <p>
            Loading configured monitoring widgets...
        </p>

    </div>


    <!-- Error -->
    <div id="dashboardError"
         class="dashboard-state d-none">

        <div class="dashboard-state-icon dashboard-state-danger">
            <i class="bi bi-exclamation-triangle"></i>
        </div>

        <h6>Unable to load dashboard</h6>

        <p id="dashboardErrorMessage">
            An error occurred while loading the dashboard.
        </p>

        <button type="button"
                class="btn btn-primary btn-sm"
                id="dashboardRetryButton">

            <i class="bi bi-arrow-clockwise me-1"></i>
            Retry

        </button>

    </div>


    <!-- Empty -->
    <div id="dashboardEmpty"
         class="dashboard-state d-none">

        <div class="dashboard-state-icon">
            <i class="bi bi-grid"></i>
        </div>

        <h6>No dashboard configuration</h6>

        <p>
            No enabled dashboard tabs or widgets are currently configured.
        </p>

    </div>


    <!-- Dashboard -->
    <div id="dashboardContainer"
         class="d-none">

        <!-- Optional date range for API-backed widgets -->
        <div id="dashboardDateRange" class="app-card mb-3 d-none">
            <div class="app-card-body">
                <div class="row g-3 align-items-end">
                    <div class="col-md-3">
                        <label for="dashboardDateRangePreset" class="form-label">Reporting Period</label>
                        <select id="dashboardDateRangePreset" class="form-select">
                            <option value="today">Today</option>
                            <option value="7days">Last 7 days</option>
                            <option value="30days">Last 30 days</option>
                            <option value="custom">Custom date range</option>
                        </select>
                    </div>
                    <div class="col-md-3" id="dashboardDateRangeFromGroup">
                        <label for="dashboardDateRangeFrom" class="form-label">From date</label>
                        <input type="date" id="dashboardDateRangeFrom" class="form-control">
                    </div>
                    <div class="col-md-3" id="dashboardDateRangeToGroup">
                        <label for="dashboardDateRangeTo" class="form-label">To date</label>
                        <input type="date" id="dashboardDateRangeTo" class="form-control">
                    </div>
                    <div class="col-md-3">
                        <button type="button" id="dashboardDateRangeApply" class="btn btn-primary">
                            Apply
                        </button>
                    </div>
                </div>
                <div id="dashboardDateRangeMessage" class="small text-muted mt-2" aria-live="polite"></div>
            </div>
        </div>

        <!-- Tabs and Dashboard Actions -->
		<div class="dashboard-tab-toolbar">
		
		    <div class="dashboard-tabs-wrapper">
		        <div class="dashboard-tabs"
		             id="dashboardTabs"
		             role="tablist"
		             aria-label="Dashboard tabs">
		        </div>
		    </div>
		
		    <div class="dashboard-tab-actions">
		
		        <button type="button"
		                class="btn btn-outline-primary btn-sm"
		                id="dashboardRefreshButton">
		
		            <i class="bi bi-arrow-clockwise me-1"></i>
		            Refresh
		
		        </button>
		
		    </div>
		
		</div>


        <!-- Tab content -->
        <div id="dashboardContent">
        </div>

    </div>


    <!-- Chart.js -->
    <script th:src="@{/js/chart.umd.min.js}"></script>

    <!-- script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.0/dist/chart.umd.min.js"></script -->


    <!-- Dashboard JavaScript -->
    <script th:src="@{/js/dashboard.js}"></script>

</div>

</body>

</html>
