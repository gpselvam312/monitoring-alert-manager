<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<div th:fragment="controls(searchId, pageSizeId, searchPlaceholder, pageSize, search)">

    <div class="p-3 border-bottom">
        <div class="row g-2 align-items-center">

            <div class="col-12 col-md">
                <div class="input-group">

                    <span class="input-group-text">
                        <i class="bi bi-search"></i>
                    </span>

                    <input type="search"
                           th:id="${searchId}"
                           class="form-control"
                           th:placeholder="${searchPlaceholder}"
                           th:value="${search}"
                           autocomplete="off">

                    <button type="button"
                            th:id="'clear-' + ${searchId}"
                            class="btn btn-outline-secondary d-none">
                        <i class="bi bi-x-lg"></i>
                    </button>

                </div>
            </div>

            <div class="col-12 col-md-auto">
                <div class="d-flex align-items-center gap-2">

                    <span class="text-muted small">
                        Page size
                    </span>

                    <select th:id="${pageSizeId}"
                            class="form-select form-select-sm"
                            style="width: 80px;">

                        <option value="5"
                                th:selected="${pageSize == 5}">
                            5
                        </option>

                        <option value="10"
                                th:selected="${pageSize == 10}">
                            10
                        </option>

                        <option value="25"
                                th:selected="${pageSize == 25}">
                            25
                        </option>

                    </select>

                </div>
            </div>

        </div>
    </div>

</div>
<div th:fragment="pagination(page, pageSize, configName)">

    <div class="d-flex flex-column flex-sm-row
                justify-content-between align-items-center
                gap-2 p-3 border-top">

        <div class="text-muted small">
            Page
            <span th:text="${page.totalPages == 0 ? 0 : page.number + 1}">1</span>
            of
            <span th:text="${page.totalPages}">1</span>
            <span class="ms-2"
                  th:text="'(' + ${page.totalElements} + ' records)'">
                (0 records)
            </span>
        </div>

        <div class="btn-group btn-group-sm">

            <button type="button"
                    class="btn btn-outline-secondary"
                    th:disabled="${page.first}"
                    th:attr="data-config=${configName},
                             data-page=0,
                             data-size=${pageSize}"
                    onclick="DataTable.pagination(this)">
                First
            </button>

            <button type="button"
                    class="btn btn-outline-secondary"
                    th:disabled="${page.first}"
                    th:attr="data-config=${configName},
                             data-page=${page.number - 1},
                             data-size=${pageSize}"
                    onclick="DataTable.pagination(this)">
                Previous
            </button>

            <button type="button"
                    class="btn btn-outline-secondary"
                    th:disabled="${page.last or page.totalPages == 0}"
                    th:attr="data-config=${configName},
                             data-page=${page.number + 1},
                             data-size=${pageSize}"
                    onclick="DataTable.pagination(this)">
                Next
            </button>

            <button type="button"
                    class="btn btn-outline-secondary"
                    th:disabled="${page.last or page.totalPages == 0}"
                    th:attr="data-config=${configName},
                             data-page=${page.totalPages - 1},
                             data-size=${pageSize}"
                    onclick="DataTable.pagination(this)">
                Last
            </button>

        </div>
    </div>

</div>


<div th:fragment="clientPagination(containerId, summaryId, firstId, previousId, nextId, lastId)"
     th:id="${containerId}"
     class="d-flex flex-column flex-sm-row justify-content-between align-items-center gap-2 p-3 border-top d-none">
        <div class="text-muted small" th:id="${summaryId}"></div>
        <div class="btn-group btn-group-sm" role="group" aria-label="Table pagination">
            <button type="button" class="btn btn-outline-secondary" th:id="${firstId}">First</button>
            <button type="button" class="btn btn-outline-secondary" th:id="${previousId}">Previous</button>
            <button type="button" class="btn btn-outline-secondary" th:id="${nextId}">Next</button>
            <button type="button" class="btn btn-outline-secondary" th:id="${lastId}">Last</button>
        </div>
</div>

</body>
</html>
