<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<body>

<div th:fragment="scripts"
     xmlns:th="http://www.thymeleaf.org">

    <script th:src="@{/js/data-table.js}"></script>
    <script th:src="@{/js/bootstrap.bundle.min.js}"></script>
    <script th:src="@{/js/form-submit-loader.js}"></script>

    <script>

        document.addEventListener("DOMContentLoaded", function () {

            // Reference-data cache is scoped to the current browser session.
            // Clear it before logout so the next login fetches fresh values.
            const logoutForm = document.querySelector('form[action$="/logout"]');
            if (logoutForm) {
                logoutForm.addEventListener("submit", function () {
                    try {
                        sessionStorage.removeItem("mam.dashboard.applications.v1");
                        Object.keys(sessionStorage).filter(function (key) {
                            return key.startsWith("mam.dashboard.environments.v1:");
                        }).forEach(function (key) {
                            sessionStorage.removeItem(key);
                        });
                    } catch (exception) {
                        // Logout must proceed even if browser storage is unavailable.
                    }
                });
            }

            /* =====================================================
               Data Tables
               ===================================================== */

            if (window.machineTableConfig) {

                DataTable.init(
                    "machineTableConfig",
                    window.machineTableConfig
                );

            }

            if (window.jobTableConfig) {

                DataTable.init(
                    "jobTableConfig",
                    window.jobTableConfig
                );

            }

            if (window.scheduleTableConfig) {

                DataTable.init(
                    "scheduleTableConfig",
                    window.scheduleTableConfig
                );

            }

            if (window.applicationTableConfig) {

                DataTable.init(
                    "applicationTableConfig",
                    window.applicationTableConfig
                );

            }

            if (window.externalApplicationsTableConfig) {

                DataTable.init(
                    "externalApplicationsTableConfig",
                    window.externalApplicationsTableConfig
                );

            }
            
            if (window.environmentTableConfig) {

                DataTable.init(
                    "environmentTableConfig",
                    window.environmentTableConfig
                );

            }
            
            if (window.dashboardTabTableConfig) {

                DataTable.init(
                    "dashboardTabTableConfig",
                    window.dashboardTabTableConfig
                );

            }

            if (window.dashboardWidgetTableConfig) {

                DataTable.init(
                    "dashboardWidgetTableConfig",
                    window.dashboardWidgetTableConfig
                );

            }


            /* =====================================================
               Mobile Sidebar
               ===================================================== */

            const menuButton =
                document.getElementById("mobileMenuButton");

            const sidebar =
                document.querySelector(".app-sidebar");

            const overlay =
                document.getElementById("sidebarOverlay");

            if (menuButton && sidebar && overlay) {

                menuButton.addEventListener(
                    "click",
                    function () {

                        sidebar.classList.add("show");

                        overlay.classList.add("show");

                    }
                );

                overlay.addEventListener(
                    "click",
                    function () {

                        sidebar.classList.remove("show");

                        overlay.classList.remove("show");

                    }
                );

            }


            /* =====================================================
               Common Application Modal
               ===================================================== */

            const appModalElement =
                document.getElementById("appModal");

            if (!appModalElement) {
                return;
            }

            const appModal =
                new bootstrap.Modal(appModalElement);

            const titleElement =
                document.getElementById("appModalTitle");

            const messageElement =
                document.getElementById("appModalMessage");

            const descriptionElement =
                document.getElementById("appModalDescription");

            const cancelButton =
                document.getElementById("appModalCancelButton");

            const cancelTextElement =
                document.getElementById("appModalCancelText");

            const confirmButton =
                document.getElementById("appModalConfirmButton");

            const confirmTextElement =
                document.getElementById("appModalConfirmText");

            const confirmIconElement =
                document.getElementById("appModalConfirmIcon");

            const bodyIconElement =
                document.getElementById("appModalBodyIcon");

            let confirmAction = null;


            /* =====================================================
               AppModal
               ===================================================== */

            window.AppModal = {

                show: function (options) {

                    options = options || {};


                    if (titleElement) {

                        titleElement.textContent =
                            options.title || "Information";

                    }


                    if (messageElement) {

                        messageElement.textContent =
                            options.message || "";

                    }


                    if (descriptionElement) {

                        if (options.description) {

                            descriptionElement.textContent =
                                options.description;

                            descriptionElement.classList.remove(
                                "d-none"
                            );

                        } else {

                            descriptionElement.textContent = "";

                            descriptionElement.classList.add(
                                "d-none"
                            );

                        }

                    }


                    if (cancelButton) {

                        cancelButton.classList.toggle(
                            "d-none",
                            options.showCancel === false
                        );

                    }


                    if (cancelTextElement) {

                        cancelTextElement.textContent =
                            options.cancelText || "Cancel";

                    }


                    if (confirmButton) {

                        confirmButton.classList.toggle(
                            "d-none",
                            options.showConfirm === false
                        );

                    }


                    if (confirmTextElement) {

                        confirmTextElement.textContent =
                            options.confirmText || "Continue";

                    }


                    if (confirmIconElement) {

                        confirmIconElement.className =
                            "bi " +
                            (options.confirmIcon || "bi-check-lg") +
                            " me-1";

                    }

                    if (confirmButton) {
                        confirmButton.classList.remove("btn-primary", "btn-danger", "btn-warning");
                        confirmButton.classList.add(options.confirmClass || "btn-primary");
                    }


                    if (bodyIconElement) {

                        bodyIconElement.className =
                            "bi " +
                            (options.icon || "bi-info-circle");

                    }


                    confirmAction =
                        typeof options.onConfirm === "function"
                            ? options.onConfirm
                            : null;


                    appModal.show();

                },


                hide: function () {

                    confirmAction = null;

                    appModal.hide();

                }

            };


            /* =====================================================
               Confirm Button
               ===================================================== */

            if (confirmButton) {

                confirmButton.addEventListener(
                    "click",
                    function () {

                        const action =
                            confirmAction;

                        confirmAction = null;

                        appModal.hide();

                        if (action) {
                            action();
                        }

                    }
                );

            }


            /* =====================================================
               Common Delete Confirmation
               ===================================================== */
 
            document.addEventListener("submit", function (event) {

                const form = event.target.closest("form[data-app-confirm], form[data-app-action=\"delete\"]");

                if (!form || event.defaultPrevented || form.dataset.confirmationBypassed === "true") {
                    return;
                }

                const action = (form.dataset.appConfirm || form.dataset.appAction || "").toLowerCase();
                if (!action) {
                    return;
                }

                event.preventDefault();

                // Do not lock the form while the dialog is open. Cancel must leave
                // the form untouched; loading starts only after explicit confirmation.
                const options = {
                    save: {
                        title: form.dataset.appActionTitle || "Save Monitoring Job",
                        message: form.dataset.appActionMessage || "Save these changes?",
                        description: form.dataset.appActionDescription || "Please confirm before continuing.",
                        icon: "bi-save",
                        confirmText: form.dataset.appConfirmText || "Save",
                        confirmIcon: "bi-check-lg",
                        confirmClass: "btn-primary"
                    },
                    update: {
                        title: form.dataset.appActionTitle || "Update Monitoring Job",
                        message: form.dataset.appActionMessage || "Update this monitoring job?",
                        description: form.dataset.appActionDescription || "Your changes will be saved.",
                        icon: "bi-pencil-square",
                        confirmText: form.dataset.appConfirmText || "Update",
                        confirmIcon: "bi-check-lg",
                        confirmClass: "btn-primary"
                    },
                    delete: {
                        title: form.dataset.appActionTitle || "Delete Monitoring Job",
                        message: form.dataset.appActionMessage || "Are you sure you want to delete this item?",
                        description: form.dataset.appActionDescription || "This action cannot be undone.",
                        icon: "bi-trash",
                        confirmText: form.dataset.appConfirmText || "Delete",
                        confirmIcon: "bi-trash",
                        confirmClass: "btn-danger"
                    },
                    enable: {
                        title: form.dataset.appActionTitle || "Enable Monitoring Job",
                        message: form.dataset.appActionMessage || "Enable this monitoring job?",
                        description: form.dataset.appActionDescription || "The job will be eligible to run according to its configuration.",
                        icon: "bi-play-circle",
                        confirmText: form.dataset.appConfirmText || "Enable",
                        confirmIcon: "bi-play-fill",
                        confirmClass: "btn-primary"
                    },
                    disable: {
                        title: form.dataset.appActionTitle || "Disable Monitoring Job",
                        message: form.dataset.appActionMessage || "Disable this monitoring job?",
                        description: form.dataset.appActionDescription || "Scheduled execution will be prevented while the job is disabled.",
                        icon: "bi-pause-circle",
                        confirmText: form.dataset.appConfirmText || "Disable",
                        confirmIcon: "bi-pause-fill",
                        confirmClass: "btn-warning"
                    },
                    run: {
                        title: form.dataset.appActionTitle || "Run Monitoring Job",
                        message: form.dataset.appActionMessage || "Run this monitoring job now?",
                        description: form.dataset.appActionDescription || "This starts a manual execution.",
                        icon: "bi-play-circle",
                        confirmText: form.dataset.appConfirmText || "Run Now",
                        confirmIcon: "bi-play-fill",
                        confirmClass: "btn-primary"
                    }
                };
                const config = options[action];
                if (!config) {
                    return;
                }
                AppModal.show(Object.assign({}, config, {
                    showCancel: true,
                    cancelText: "Cancel",
                    showConfirm: true,
                    onConfirm: function () {
                        // Re-submit through the normal submit-event lifecycle so form-specific
                        // serializers and validators run before the browser builds the request.
                        // The bypass flag prevents this confirmed submission from reopening the dialog.
                        form.dataset.confirmationBypassed = "true";
                        if (typeof form.requestSubmit === "function") {
                            form.requestSubmit();
                        } else {
                            // Legacy fallback for browsers without requestSubmit support.
                            FormSubmitLoader.show(form);
                            form.submit();
                        }
                    }
                }));
            });


            /* =====================================================
               Normal Form Submit Loader
               ===================================================== */

            document.addEventListener("submit", function (event) {

                const form = event.target;

                if (!(form instanceof HTMLFormElement)) {
                    return;
                }

                /*
                 * Delete forms are handled by the confirmation
                 * above and explicitly call the loader after
                 * confirmation.
                 */
                if (form.dataset.appConfirm || (form.dataset.appAction || "").toLowerCase() === "delete") {
                    return;
                }

                /*
                 * Do not show loader when browser validation fails.
                 */
                if (!form.checkValidity()) {
                    return;
                }

                FormSubmitLoader.show(form);
            });



            /* =====================================================
               Flash Messages
               ===================================================== */

            /* Keep flash messages visible at the top of the page instead of
               moving them into a modal. Focus/scroll only when the message is
               outside the viewport; errors remain until dismissed. */
            const message = document.querySelector(".app-message");
            if (message) {
                const rect = message.getBoundingClientRect();
                if (rect.top < 0 || rect.bottom > window.innerHeight) {
                    message.scrollIntoView({ behavior: "smooth", block: "start" });
                }
                message.setAttribute("tabindex", "-1");
                message.focus({ preventScroll: true });
                if (message.classList.contains("app-message-success")) {
                    window.setTimeout(function () {
                        if (message.isConnected) message.remove();
                    }, 8000);
                }
            }

        });


        /* =========================================================
           Data Table Responsive Actions
           ========================================================= */

        window.addEventListener(
            "resize",
            function () {

                Object.keys(DataTable.configs)
                    .forEach(function (name) {

                        DataTable.updateCompactActions(
                            DataTable.configs[name]
                        );

                    });

            }
        );

    </script>

</div>

</body>

</html>
