<aside class="app-sidebar"
       th:fragment="sidebar"
       xmlns:th="http://www.thymeleaf.org"
       xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

    <a class="sidebar-brand"
       th:href="@{/dashboard}"
       aria-label="Return to the dashboard"
       title="Go to dashboard">
        <div class="sidebar-logo">
            <img th:src="@{/images/logo.png}" alt="DXC Technology">
        </div>
        <div class="sidebar-brand-text" th:text="${applicationName}">
            Monitoring Alert Manager
        </div>
    </a>

    <nav class="sidebar-navigation" aria-label="Main navigation">
        <div class="sidebar-section" th:each="section : ${sidebarSections}">
            <div class="sidebar-section-title" th:text="${section.name}">Section</div>
            <a th:each="item : ${section.items}"
               th:href="@{${item.href}}"
               class="sidebar-link"
               th:classappend="${currentPage == item.menuKey} ? ' active' : ''">
                <i th:class="${'bi ' + item.icon}" aria-hidden="true"></i>
                <span th:text="${item.label}">Menu item</span>
            </a>
        </div>
        <div class="sidebar-section" sec:authorize="hasAuthority('MONITORING_CONFIG')">
            <div class="sidebar-section-title">Administration</div>
            <a th:href="@{/administration/external-applications}"
               class="sidebar-link"
               th:classappend="${currentPage == 'external-applications'} ? ' active' : ''">
                <i class="bi bi-window-stack" aria-hidden="true"></i>
                <span>External Applications</span>
            </a>
        </div>
    </nav>
</aside>
