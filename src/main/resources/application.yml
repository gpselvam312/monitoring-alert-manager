spring:
  application:
    name: monitoring-alert-manager

  datasource:
    url: ${MONITORING_DB_URL:jdbc:postgresql://localhost:5432/ra_fcb_monitors?currentSchema=ra_fcb}
    username: ${MONITORING_DB_USERNAME:}
    password: ${MONITORING_DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

monitoring:
  pagination:
    default-page-size: ${MONITORING_PAGE_DEFAULT_SIZE:5}
    allowed-page-sizes: ${MONITORING_PAGE_ALLOWED_SIZES:5,10,25}
    max-page-size: ${MONITORING_PAGE_MAX_SIZE:100}
  lookup:
    # Records fetched per server request; independent from the UI page size.
    fetch-size: ${MONITORING_LOOKUP_FETCH_SIZE:100}
  datetime-format: "MM/dd/yyyy hh:mm:ss a"
  streaming:
    max-runtime-seconds: ${MONITORING_STREAMING_MAX_RUNTIME_SECONDS:86400}
    ssh-user: ${MONITORING_STREAMING_SSH_USER:}
    ssh-key-path: ${MONITORING_STREAMING_SSH_KEY_PATH:}
    ssh-port: ${MONITORING_STREAMING_SSH_PORT:22}
    node-id: ${MONITORING_STREAMING_NODE_ID:${HOSTNAME:localhost}}

  security:
    script:
      # Trusted directories remain environment-specific; approved hashes are stored per Monitoring Job.
      allowed-directories: ${MONITORING_SCRIPT_ALLOWED_DIRECTORIES:${user.dir}/scripts}
      validation:
        enabled: ${MONITORING_SCRIPT_VALIDATION_ENABLED:true}
        restricted-commands:
          - sudo
          - su
          - doas
          - pkexec
          - rm
          - rmdir
          - shred
          - mkfs
          - wipefs
          - fdisk
          - parted
          - dd
          - truncate
          - shutdown
          - reboot
          - poweroff
          - halt
          - kill
          - killall
          - pkill
          - systemctl
          - service
          - chmod
          - chown
          - mount
          - umount
          - docker
          - podman
          - iptables
          - nft
        allowed-command-rules: []
        # Example narrow exception:
        # allowed-command-rules:
        #   - command: rm
        #     allowed-arguments: ["-f", "*.tmp"]
    encryption:
      # Supply a Base64-encoded 32-byte key through the runtime environment; never commit production keys.
      # Development fallback only. Production must override this with a secret-managed 32-byte key.
      key: ${MONITORING_ENCRYPTION_KEY:${MONITORING_EXTERNAL_APP_ENCRYPTION_KEY:TW9uaXRvcmluZ0FsZXJ0TWFuYWdlckRldktleTIwMjY=}}
      previous-key: ${MONITORING_PREVIOUS_ENCRYPTION_KEY:}
      # Set true for one startup to migrate all encrypted values, then return to false and remove previous-key.
      updatePwd: ${MONITORING_ENCRYPTION_UPDATE_PWD:false}
