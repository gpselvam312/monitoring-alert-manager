spring:
  application:
    name: monitoring-alert-manager

  datasource:
    url: jdbc:postgresql://10.166.6.246:5432/ra_fcb_monitors?currentSchema=ra_fcb
    username: rafcb_user
    password: rafcbuser@123
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

monitoring:
  datetime-format: "MM/dd/yyyy hh:mm:ss a"
