name: Maven compile

on:
  push:
    branches:
      - feature/monitoring-execution-scheduling
  pull_request:
    branches:
      - feature/monitoring-execution-scheduling

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Compile
        run: mvn -B test
